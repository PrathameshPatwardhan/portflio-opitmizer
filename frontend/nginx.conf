# Serves the Vite build and proxies /api/* to the Spring Boot backend,
# so the browser never talks cross-origin in the composed stack.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
