services:
  - type: web
    name: pmp-portfolio-quant
    env: docker
    dockerfilePath: ./quant-service/Dockerfile
    plan: free
    healthCheckPath: /health

  - type: web
    name: pmp-portfolio-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QUANT_SERVICE_URL
        value: https://pmp-portfolio-quant.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://portflio-opitmizer-e1n4.vercel.app
