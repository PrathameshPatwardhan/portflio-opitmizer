services:
  quant-service:
    build: ./quant-service
    ports:
      - "8000:8000"
    # First request warms the yfinance cache; allow generous startup time.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      quant-service:
        condition: service_healthy
    environment:
      QUANT_SERVICE_URL: http://quant-service:8000

  frontend:
    build: ./frontend
    ports:
      # App UI at http://localhost:3000 ; nginx proxies /api/* to the backend.
      - "3000:80"
    depends_on:
      - backend
